name: Frontend Continuous Integration

on:
  pull_request:
    branches:
      - main
    paths:
      - 'starter/frontend/**'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend

      - name: Run lint
        working-directory: starter/frontend
        run: npm run lint

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend

      - name: Run tests
        working-directory: starter/frontend
        run: npm test -- --watchAll=false

  build:
    runs-on: ubuntu-latest

    needs:
      - lint
      - test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend

      - name: Build Docker image
        working-directory: starter/frontend
        run: |
          docker build \
            --build-arg REACT_APP_MOVIE_API_URL=http://localhost:5000 \
            -t mp-frontend:${{ github.sha }} \
            .

  notify-on-failure:
    needs:
      - lint
      - test
      - build

    if: failure() && github.event_name == 'pull_request'

    runs-on: ubuntu-latest

    steps:
      - name: Report failure
        run: |
          echo "Frontend CI failed. Please check the workflow logs."